# cspell:ignore pathofbuildingcommunity pathofbuilding modcache
name: Run Tests
on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]
  workflow_dispatch:
jobs:
  test_planning_workflow:
    runs-on: ubuntu-latest
    container: ghcr.io/pathofbuildingcommunity/pathofbuilding-tests:latest
    steps:
      - name: Install MCP client runtime
        run: apk add nodejs
      - uses: actions/checkout@v4
      - name: Exercise MCP planning through native review and save
        run: node tools/test_planning_workflow.cjs
  test_ai_bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test desktop MCP bridge
        run: node --test spec/AI/*.test.cjs
  test_headless_ui:
    runs-on: ubuntu-latest
    container: ghcr.io/pathofbuildingcommunity/pathofbuilding-tests:latest
    steps:
      # cspell:ignore py3
      - name: Install headless test dependencies
        run: apk add git python3 py3-pillow
      - uses: actions/checkout@v4
      - name: Exercise controls and audit frames
        run: |
          python3 tools/check_loot_filter_data.py
          python3 tools/check_headless_ui.py
      - name: Upload headless UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-ui
          path: artifacts/headless-ui
          if-no-files-found: error
  run_tests:
    runs-on: ubuntu-latest
    container: ghcr.io/pathofbuildingcommunity/pathofbuilding-tests:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run tests
        run: busted --lua=luajit
  check_modcache:
    runs-on: ubuntu-latest
    container: ghcr.io/pathofbuildingcommunity/pathofbuilding-tests:latest
    steps:
      - name: Install git dependency
        run: apk add git
      - name: Checkout
        uses: actions/checkout@v4
      - name: Regenerate ModCache
        env:
          LUA_PATH: ../runtime/lua/?.lua;../runtime/lua/?/init.lua;;
          REGENERATE_MOD_CACHE: 1
        run: cd src; luajit HeadlessWrapper.lua
      - run: git config --global --add safe.directory $(pwd)
      - name: Check if the generated ModCache is different
        run: git diff --exit-code src/Data/ModCache.lua
