# cspell:ignore contribs pathlib
name: Spell Checker

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to checkout
        default: dev
        required: false

jobs:
  spellcheck:
    runs-on: ubuntu-latest
    env:
      CONFIG_URL:  https://raw.githubusercontent.com/Nightblade/pob-dict/main
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Fetch pull request diff commits
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}

      - name: Fetch config file and dictionaries
        run:
          curl --silent --show-error --parallel --remote-name-all
            ${{ env.CONFIG_URL }}/cspell.json
            ${{ env.CONFIG_URL }}/pob-dict.txt
            ${{ env.CONFIG_URL }}/poe-dict.txt
            ${{ env.CONFIG_URL }}/ignore-dict.txt
            ${{ env.CONFIG_URL }}/extra-en-dict.txt
            ${{ env.CONFIG_URL }}/contribs-dict.txt

      - name: Exclude pinned filter templates and generated snapshots
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('cspell.json')
          text = path.read_text()
          marker = '"ignorePaths": ['
          assert marker in text
          path.write_text(text.replace(marker, marker + '"**/src/Data/LootFilters/**", "**/src/Assets/LootFilters/**", "**/src/Data/Crafting/3.30-abyss-weights.json",', 1))
          PY

      - name: Run cspell
        uses: streetsidesoftware/cspell-action@v8
        with:
          files: '**' # needed as workaround for non-incremental runs (overrides in config still work ok)
          config: "cspell.json"
          incremental_files_only: ${{ github.event_name != 'workflow_dispatch' }}
